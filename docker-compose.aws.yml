# ===========================================================================
# AIHire — AWS / cloud production stack
# ===========================================================================
# Production-tuned: values are driven by environment variables (set them in a
# server-side ./.env or your orchestrator's secret store). Postgres and Redis
# are NOT published to the host — they are only reachable on the private
# `appnet` network. Put an ALB / Nginx / Caddy in front of the frontend and
# backend for TLS termination.
#
# Required env (./.env on the server):
#   PUBLIC_API_BASE   e.g. https://api.aihire.com   (public backend URL)
#   APP_URL           e.g. https://aihire.com        (public frontend URL)
#   JWT_SECRET        strong random secret
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / GOOGLE_REDIRECT_URI
#   RESEND_API_KEY / RESEND_FROM
#   POSTGRES_PASSWORD strong random secret
#
# Usage:
#   docker compose -f docker-compose.aws.yml --env-file .env up -d --build
# ===========================================================================

services:
  # ---- Frontend (Next.js UI) ----
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the client bundle at build time — must be the PUBLIC backend URL.
        NEXT_PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://localhost:8000}
      INTERNAL_API_BASE: http://backend:8000
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - appnet
    restart: always

  # ---- Backend API (FastAPI) ----
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-hiring}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hiring}
      REDIS_URL: redis://redis:6379/0
      # Public frontend URL for OAuth redirect + verification email links
      APP_URL: ${APP_URL:?set APP_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      # Google OAuth (web-server code flow) — GOOGLE_REDIRECT_URI must match the
      # authorized redirect URI registered in the Google Cloud console.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:?set GOOGLE_REDIRECT_URI}
      # Resend transactional email
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-AIHire <onboarding@resend.dev>}
      # Embedding model
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      ENABLE_SBERT: ${ENABLE_SBERT:-1}
      ENABLE_LLM: ${ENABLE_LLM:-0}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen2.5-3B-Instruct}
      # Job Board (optional)
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_API_KEY: ${ADZUNA_API_KEY:-}
    volumes:
      - backend-runtime:/app/backend/runtime
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "/app/backend/startup.sh"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; exit(0 if urllib.request.urlopen(\"http://localhost:8000/health\", timeout=5).status == 200 else 1)'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - appnet
    restart: always

  # ---- Postgres (internal only — no published host port) ----
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hiring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hiring}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hiring} -d ${POSTGRES_DB:-hiring}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - appnet
    restart: always

  # ---- Redis (internal only — no published host port) ----
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - appnet
    restart: always

volumes:
  backend-runtime:
  postgres-data:

networks:
  appnet:
    driver: bridge
